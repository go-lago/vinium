services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vinium
      POSTGRES_PASSWORD: vinium
      POSTGRES_DB: vinium
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinium"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
